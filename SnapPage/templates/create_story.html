{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Створити історію</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0b0b] text-white flex items-center justify-center h-screen select-none">
    <div class="bg-[#121212] p-6 rounded-2xl border border-[#262626] w-full max-w-md text-center space-y-6">
        <h2 class="text-xl font-bold">Створити історію</h2>

        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            <label for="story-file-input" class="flex flex-col items-center justify-center w-full h-48 border-2 border-dashed border-[#3d3d3d] hover:border-[#fffc00] rounded-xl cursor-pointer bg-[#1c1c1c] transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400 mb-2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                <span class="text-sm text-gray-400">Оберіть фото або відео</span>
                {{ form.media_file }}
            </label>

            <div class="flex justify-between space-x-3 pt-2">
                <a href="{% url 'SnapPage:openhome' %}" class="w-1/2 py-2.5 rounded-xl bg-[#2f2f2f] hover:bg-[#3d3d3d] transition font-medium text-sm text-center flex items-center justify-center">Скасувати</a>
                <button type="submit" class="w-1/2 py-2.5 rounded-xl bg-[#fffc00] text-black font-semibold hover:bg-yellow-400 transition text-sm">Опублікувати</button>
            </div>
        </form>
    </div>
</body>
</html>
